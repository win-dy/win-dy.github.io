<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人网站首页">
    <title>个人主页</title>
    <style>
        /* 重置一些基本的浏览器默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        h1, h2, h3 {
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            background: #333;
            color: #fff;
            padding: 1rem 0;
        }

        .navbar {
            width: 90%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar ul {
            list-style: none;
            display: flex;
        }

        .navbar li {
            margin-left: 20px;
        }

        .navbar a {
            color: #fff;
            font-size: 18px;
            padding: 5px 10px;
            transition: background 0.3s ease;
        }

        .navbar a:hover {
            background-color: #575757;
            border-radius: 5px;
        }

        #hero {
            background: url('hero-bg.jpg') no-repeat center center/cover;
            padding: 100px 0;
            color: white;
            text-align: center;
        }

        #hero .hero-content {
            max-width: 600px;
            margin: 0 auto;
        }

        #hero h2 {
            font-size: 2.5rem;
        }

        #hero p {
            font-size: 1.2rem;
            margin: 20px 0;
        }

        .btn {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        #projects .projects {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .project-card {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 30%;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-10px);
        }

        ul {
            list-style: none;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <h1>欢迎来到我的个人网站</h1>
            <nav>
                <ul>
                    <li><a href="#about">关于我</a></li>
                    <li><a href="#projects">项目展示</a></li>
                    <li><a href="#contact">联系我</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="hero-content">
            <h2>你好，我是 [你的名字]</h2>
            <p>欢迎来到我的个人网站！这里展示了我个人的项目和一些想法。</p>
            <a href="#about" class="btn">了解更多</a>
        </div>
    </section>

    <section id="about">
        <h2>关于我</h2>
        <p>这里可以写一些个人信息、背景、兴趣爱好等内容。</p>
    </section>

    <section id="projects">
        <h2>我的项目</h2>
        <div class="projects">
            <div class="project-card">
                <h3>项目 1</h3>
                <p>项目描述...</p>
            </div>
            <div class="project-card">
                <h3>项目 2</h3>
                <p>项目描述...</p>
            </div>
            <div class="project-card">
                <h3>项目 3</h3>
                <p>项目描述...</p>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>联系我</h2>
        <p>你可以通过以下方式联系我：</p>
        <ul>
            <li>Email: example@example.com</li>
            <li>GitHub: <a href="https://github.com/yourusername" target="_blank">yourusername</a></li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2024 个人网站. 版权所有。</p>
    </footer>

    <script>
        // 示例 JavaScript，可以扩展其他功能，比如动态效果等
        document.addEventListener("DOMContentLoaded", function () {
            console.log("个人网站加载完成！");
        });
    </script>
</body>
</html>
