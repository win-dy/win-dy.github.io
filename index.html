<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作性价比测算</title>
    <style>
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                display: flex;
                align-items: center;
                justify-content: space-around;
            }

            .container>div {
                width: 100%;
            }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
        }

        .container {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-direction: column;

        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .input-field,
        .select-field {
            padding: 5px;
            margin: 5px;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        #calculation-form>div {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <header>
        工作性价比测算
    </header>

    <div class="container">
        <img style="width: 300px;" src="./staic/image/image.png" alt="">



        <form id="calculation-form">
            <div>
                <label for="average-salary">平均日薪酬：</label>
                <input type="number" id="average-salary" class="input-field" placeholder="请输入日薪酬" required>
            </div>
            <div>
                <label for="work-hours">工作时长：</label>
                <input type="number" id="work-hours" class="input-field" step="0.1" placeholder="请输入工作时长" required>
            </div>
            <div>
                <label for="commute-hours">通勤时长：</label>
                <input type="number" id="commute-hours" class="input-field" step="0.1" placeholder="请输入通勤时长" required>
            </div>
            <div>
                <label for="fish-hours">摸鱼时长：</label>
                <input type="number" id="fish-hours" class="input-field" step="0.1" placeholder="请输入摸鱼时长" required>
            </div>
            <div>
                <label for="education-coefficient">学历系数：</label>
                <select id="education-coefficient" class="select-field" required>
                    <option value="0.8">专科及以下</option>
                    <option value="1">普通本科</option>
                    <option value="1.2">985/211本科</option>
                    <option value="1.4">普通硕士</option>
                    <option value="1.6">985/211硕士</option>
                    <option value="1.8">普通博士</option>
                    <option value="2">985/211博士</option>
                </select>
            </div>
            <div>
                <label for="work-env-coefficient">工作环境系数：</label>
                <select id="work-env-coefficient" class="select-field" required>
                    <option value="0.8">偏僻地区</option>
                    <option value="0.9">工厂户外</option>
                    <option value="1">普通</option>
                    <option value="1.1">体制内</option>
                </select>
            </div>
            <div>
                <label for="opposite-gender-coefficient">异性环境系数：</label>
                <select id="opposite-gender-coefficient" class="select-field" required>
                    <option value="0.9">没有</option>
                    <option value="1">不多不少</option>
                    <option value="1.1">很多</option>
                </select>
            </div>
            <div>
                <label for="colleague-env-coefficient">同事环境系数：</label>
                <select id="colleague-env-coefficient" class="select-field" required>
                    <option value="0.95">SB很多</option>
                    <option value="1">普通很多</option>
                    <option value="1.05">优秀很多</option>
                </select>
            </div>
            <div>
                <label for="qualification-coefficient">职业资格系数：</label>
                <select id="qualification-coefficient" class="select-field" required>
                    <option value="1">无要求、二级</option>
                    <option value="1.05">建造造价监理</option>
                    <option value="1.1">建筑岩土结构</option>
                    <option value="1.15">主任医师、教授</option>
                </select>
            </div>
            <div>
                <label for="before-8am">是否8:30前上班：</label>
                <select id="before-8am" class="select-field" required>
                    <option value="0.95">是</option>
                    <option value="1">否</option>
                </select>
            </div>

            <button type="submit" class="btn">计算性价比</button>
        </form>

        <div id="result" style="margin-top: 20px; display: none;">
            <h3>测算结果：</h3>
            <p id="result-text"></p>
        </div>

    </div>

    <script>
        document.getElementById('calculation-form').addEventListener('submit', function (event) {
            event.preventDefault();

            // Get input values
            const averageSalary = parseFloat(document.getElementById('average-salary').value);
            const workHours = parseFloat(document.getElementById('work-hours').value);
            const commuteHours = parseFloat(document.getElementById('commute-hours').value);
            const fishHours = parseFloat(document.getElementById('fish-hours').value);
            const educationCoefficient = parseFloat(document.getElementById('education-coefficient').value);
            const workEnvCoefficient = parseFloat(document.getElementById('work-env-coefficient').value);
            const oppositeGenderCoefficient = parseFloat(document.getElementById('opposite-gender-coefficient').value);
            const colleagueEnvCoefficient = parseFloat(document.getElementById('colleague-env-coefficient').value);
            const qualificationCoefficient = parseFloat(document.getElementById('qualification-coefficient').value);
            const before8amCoefficient = parseFloat(document.getElementById('before-8am').value);
            debugger
            // Validate inputs
            if (isNaN(averageSalary) || isNaN(workHours) || isNaN(commuteHours) || isNaN(fishHours) || averageSalary <= 0 || workHours <= 0) {
                alert("请输入有效的数字！");
                return;
            }

            const workTime = workHours + commuteHours - 0.5 * fishHours;  // 计算工作时长
            const costEffectiveness = (averageSalary * workEnvCoefficient * oppositeGenderCoefficient * colleagueEnvCoefficient * qualificationCoefficient * before8amCoefficient) / (35 * workTime * educationCoefficient);

            // Display the result
            let resultText = '';
            if (costEffectiveness < 0.8) {
                resultText = `分数为${costEffectiveness}，工作性价比低，很惨！`;
            } else if (costEffectiveness >= 0.8 && costEffectiveness <= 1.5) {
                resultText = `分数为${costEffectiveness}，工作性价比较好，很爽！`;
            } else if (costEffectiveness > 1.5) {
                resultText = `分数为${costEffectiveness}，工作性价比非常好，爽爆了！`;
            }

            // Show the result
            document.getElementById('result-text').textContent = resultText;
            document.getElementById('result').style.display = 'block';
        });
    </script>

</body>

</html>
