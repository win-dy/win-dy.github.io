<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人旅行档案 · 中国城市足迹地图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --accent: #3a7bd5;
      --visited: #6366f1;
      --visited-bg: #eef2ff;
      --unvisited: #94a3b8;
      --unvisited-bg: #f1f5f9;
      --gray-map: #e2e8f0;
      --text: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 6px 18px rgba(0,0,0,0.06);
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 1440px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(120deg, #5b6cc4, #3a7bd5);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header h1 i { margin-right: 8px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background: rgba(255,255,255,0.2); color: #fff; }
    .btn-primary:hover { background: rgba(255,255,255,0.35); }
    .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--visited-bg); }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-success { background: var(--primary); color: #fff; }
    .btn-success:hover { background: #4338ca; }
    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      padding: 20px;
      background: #fafbfc;
      min-height: 0;
    }
    @media (max-width: 960px) { .main-content { flex-direction: column; } }
    .map-section {
      flex: 1;
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .section-title {
      text-align: center;
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    #china-map { width: 100%; flex: 1; min-height: 420px; border-radius: 10px; }
    .map-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 4px; }
    .sidebar {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    @media (max-width: 960px) { .sidebar { width: 100%; } }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-card.wide { grid-column: span 2; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .panel {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .panel-header h3 { font-size: 1rem; color: var(--primary); }
    .province-info {
      background: var(--visited-bg);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
    }
    .province-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; }
    .progress-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
    .progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary-light), var(--primary)); transition: width 0.5s; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .toolbar input, .toolbar select {
      flex: 1;
      min-width: 100px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .cities-scroll { flex: 1; overflow-y: auto; max-height: 340px; }
    .cities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }
    .city-chip {
      padding: 10px 6px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s;
      position: relative;
    }
    .city-chip.visited {
      background: var(--visited-bg);
      border-color: #c7d2fe;
      color: var(--visited);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(99,102,241,0.15);
    }
    .city-chip.not-visited {
      background: var(--unvisited-bg);
      color: var(--unvisited);
    }
    .city-chip:hover { transform: translateY(-2px); }
    .city-chip.active { outline: 2px solid var(--primary); outline-offset: 2px; }
    .city-chip .rating-mini {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.65rem;
      color: #f59e0b;
    }
    /* 城市档案弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(3px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-head {
      background: linear-gradient(120deg, #5b6cc4, #3a7bd5);
      color: #fff;
      padding: 20px 24px;
      position: relative;
    }
    .modal-head h2 { font-size: 1.4rem; }
    .modal-head .subtitle { opacity: 0.85; font-size: 0.9rem; margin-top: 4px; }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }
    .modal-body { padding: 20px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .star-rating { display: flex; gap: 4px; }
    .star-rating i { font-size: 1.4rem; cursor: pointer; color: #d1d5db; transition: color 0.15s; }
    .star-rating i.active, .star-rating i.hover { color: #f59e0b; }
    .photo-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-item {
      aspect-ratio: 4/3;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: var(--unvisited-bg);
    }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .photo-item .remove-photo {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .photo-add {
      aspect-ratio: 4/3;
      border: 2px dashed var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.78rem;
      gap: 4px;
    }
    .photo-add:hover { border-color: var(--primary); color: var(--primary); }
    .photo-url-row { display: flex; gap: 8px; margin-top: 8px; }
    .photo-url-row input { flex: 1; }
    .modal-footer {
      padding: 0 24px 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .visit-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #cbd5e1;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .view-mode .form-group input,
    .view-mode .form-group textarea { border: none; background: #f8fafc; pointer-events: none; }
    .view-mode .photo-add, .view-mode .photo-url-row, .view-mode .remove-photo { display: none !important; }
    .view-mode .star-rating i { pointer-events: none; }
    .empty-tip { text-align: center; color: var(--unvisited); padding: 24px; font-style: italic; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 2000;
      transition: transform 0.3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    footer {
      text-align: center;
      padding: 14px;
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.9);
      z-index: 10;
      flex-direction: column;
      gap: 10px;
      color: var(--primary);
    }
    .map-wrap { position: relative; flex: 1; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-book-open"></i> 个人旅行档案</h1>
      <div class="header-actions">
        <button class="btn btn-primary" id="btn-load-sample"><i class="fas fa-magic"></i> 加载示例</button>
        <button class="btn btn-primary" id="btn-export"><i class="fas fa-download"></i> 导出</button>
        <button class="btn btn-primary" id="btn-import"><i class="fas fa-upload"></i> 导入</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </header>

    <div class="main-content">
      <div class="map-section">
        <div class="section-title"><i class="fas fa-map"></i> 中国足迹地图</div>
        <div class="map-wrap">
          <div class="map-loading" id="map-loading"><i class="fas fa-spinner fa-spin fa-2x"></i><span>加载地图中...</span></div>
          <div id="china-map"></div>
        </div>
        <div class="map-legend">
          <div class="legend-item"><span class="legend-dot" style="background:#6366f1"></span> 已到访省份</div>
          <div class="legend-item"><span class="legend-dot" style="background:#e2e8f0"></span> 未到访省份</div>
        </div>
      </div>

      <div class="sidebar">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="stat-provinces">0</div><div class="stat-label">已访省份</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-cities">0</div><div class="stat-label">已访城市</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-expense">¥0</div><div class="stat-label">累计花费</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-rating">-</div><div class="stat-label">平均推荐</div></div>
        </div>

        <div class="panel">
          <div class="panel-header"><h3><i class="fas fa-list"></i> 城市列表</h3></div>
          <div class="province-info">
            <div class="province-name" id="province-name">请点击地图选择省份</div>
            <div class="progress-row">
              <span>已访 <b id="province-visited">0</b> / <span id="province-total">0</span></span>
              <span style="margin-left:auto;color:var(--primary);font-weight:600" id="province-pct">0%</span>
            </div>
            <div class="progress-bar-wrap"><div class="progress-bar" id="province-bar" style="width:0%"></div></div>
          </div>
          <div class="toolbar">
            <input type="search" id="city-search" placeholder="搜索城市...">
            <select id="city-filter">
              <option value="all">全部</option>
              <option value="visited">已到访</option>
              <option value="unvisited">未到访</option>
            </select>
          </div>
          <div class="cities-scroll">
            <div class="cities-grid" id="cities-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <footer>数据保存在浏览器本地 · 点击城市查看/编辑旅行档案 · 支持导入导出备份</footer>
  </div>

  <!-- 城市档案弹窗 -->
  <div class="modal-overlay" id="archive-modal">
    <div class="modal" id="archive-modal-inner">
      <div class="modal-head">
        <h2 id="modal-city-name">城市名</h2>
        <div class="subtitle" id="modal-province-name">省份</div>
        <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="visit-toggle">
          <label class="switch"><input type="checkbox" id="field-visited"><span class="slider"></span></label>
          <span id="visit-label">标记为已到访</span>
        </div>
        <div class="form-group">
          <label><i class="fas fa-calendar-alt"></i> 第一次去的时间</label>
          <input type="date" id="field-firstVisit">
        </div>
        <div class="form-group">
          <label><i class="fas fa-images"></i> 照片</label>
          <div class="photo-gallery" id="photo-gallery"></div>
          <div class="photo-url-row">
            <input type="url" id="photo-url-input" placeholder="粘贴图片链接后添加">
            <button class="btn btn-ghost" id="btn-add-url"><i class="fas fa-plus"></i></button>
          </div>
          <input type="file" id="photo-file-input" accept="image/*" hidden multiple>
        </div>
        <div class="form-group">
          <label><i class="fas fa-pen"></i> 游记</label>
          <textarea id="field-notes" placeholder="记录旅途见闻、美食、感受..."></textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-yen-sign"></i> 花费（元）</label>
          <input type="number" id="field-expense" min="0" step="100" placeholder="0">
        </div>
        <div class="form-group">
          <label><i class="fas fa-star"></i> 推荐指数</label>
          <div class="star-rating" id="star-rating"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-edit-toggle"><i class="fas fa-edit"></i> 编辑</button>
        <button class="btn btn-success" id="btn-save"><i class="fas fa-save"></i> 保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    const STORAGE_KEY = 'travel_archive_v1';
    let travelData = JSON.parse(JSON.stringify(DEFAULT_TRAVEL_DATA));
    let archives = {};
    let myChart = null;
    let currentProvince = null;
    let editingCity = null;
    let isEditMode = true;
    let currentRating = 0;

    // ── 存储 ──
    function archiveKey(province, city) { return `${province}|${city}`; }

    function loadStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.travelData) travelData = saved.travelData;
        if (saved.archives) archives = saved.archives;
      } catch (e) { console.warn('读取本地数据失败', e); }
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ travelData, archives }));
    }

    function emptyArchive() {
      return { firstVisit: '', photos: [], notes: '', expense: 0, rating: 0 };
    }

    function getArchive(province, city) {
      const key = archiveKey(province, city);
      return { ...emptyArchive(), ...(archives[key] || {}) };
    }

    function setArchive(province, city, data) {
      archives[archiveKey(province, city)] = data;
    }

    // ── 统计 ──
    function calcStats() {
      let provinces = 0, cities = 0, expense = 0, ratingSum = 0, ratingCount = 0;
      for (const pn in travelData) {
        let hasVisited = false;
        for (const c of travelData[pn].cities) {
          if (c.visited) {
            cities++;
            hasVisited = true;
            const a = getArchive(pn, c.name);
            expense += Number(a.expense) || 0;
            if (a.rating > 0) { ratingSum += a.rating; ratingCount++; }
          }
        }
        if (hasVisited) provinces++;
      }
      document.getElementById('stat-provinces').textContent = provinces;
      document.getElementById('stat-cities').textContent = cities;
      document.getElementById('stat-expense').textContent = '¥' + expense.toLocaleString();
      document.getElementById('stat-rating').textContent = ratingCount
        ? (ratingSum / ratingCount).toFixed(1) + ' ★' : '-';
    }

    // ── 地图 ──
    function getMapData() {
      return Object.keys(travelData).map(pn => {
        const pd = travelData[pn];
        const visited = pd.cities.filter(c => c.visited).length;
        const total = pd.cities.length;
        return { name: pn, value: total ? (visited / total) * 100 : 0, visited: visited > 0 };
      });
    }

    async function initMap() {
      const dom = document.getElementById('china-map');
      myChart = echarts.init(dom);
      try {
        const res = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
        const geoJson = await res.json();
        echarts.registerMap('china', geoJson);
        renderMap();
        myChart.on('click', p => { currentProvince = p.name; renderCities(); });
        document.getElementById('map-loading').style.display = 'none';
        window.addEventListener('resize', () => myChart.resize());
      } catch (e) {
        document.getElementById('map-loading').innerHTML =
          '<i class="fas fa-exclamation-triangle"></i><span>地图加载失败，请检查网络</span>';
      }
    }

    function renderMap() {
      if (!myChart) return;
      const data = getMapData();
      myChart.setOption({
        tooltip: {
          trigger: 'item',
          formatter: p => {
            const v = p.data?.value ?? 0;
            const visited = p.data?.visited;
            return `<b>${p.name}</b><br/>${visited ? `访问完成度 ${v.toFixed(0)}%` : '尚未到访'}`;
          },
          backgroundColor: 'rgba(255,255,255,0.96)',
          borderColor: '#e2e8f0',
          extraCssText: 'border-radius:10px;padding:10px;'
        },
        series: [{
          type: 'map', map: 'china', roam: true, zoom: 1.6, center: [105, 35],
          label: { show: true, fontSize: 9, color: '#475569' },
          emphasis: { label: { fontWeight: 'bold', color: '#4f46e5' }, itemStyle: { areaColor: '#fbbf24' } },
          itemStyle: { borderColor: '#fff', borderWidth: 1 },
          data: data.map(d => ({
            name: d.name,
            value: d.value,
            visited: d.visited,
            itemStyle: d.visited
              ? { areaColor: getVisitedColor(d.value) }
              : { areaColor: '#e2e8f0' }
          }))
        }]
      }, true);
    }

    function getVisitedColor(pct) {
      const colors = ['#c7d2fe', '#a5b4fc', '#818cf8', '#6366f1', '#4f46e5', '#4338ca'];
      const idx = Math.min(Math.floor(pct / 20), colors.length - 1);
      return colors[idx];
    }

    // ── 城市列表 ──
    function renderCities() {
      const grid = document.getElementById('cities-grid');
      const search = document.getElementById('city-search').value.trim();
      const filter = document.getElementById('city-filter').value;

      if (!currentProvince || !travelData[currentProvince]) {
        document.getElementById('province-name').textContent = '请点击地图选择省份';
        grid.innerHTML = '<div class="empty-tip">在左侧地图点击省份</div>';
        return;
      }

      const pd = travelData[currentProvince];
      document.getElementById('province-name').textContent = pd.name;
      const visitedCount = pd.cities.filter(c => c.visited).length;
      const total = pd.cities.length;
      const pct = total ? Math.round(visitedCount / total * 100) : 0;
      document.getElementById('province-visited').textContent = visitedCount;
      document.getElementById('province-total').textContent = total;
      document.getElementById('province-pct').textContent = pct + '%';
      document.getElementById('province-bar').style.width = pct + '%';

      let cities = pd.cities.map((c, i) => ({ ...c, index: i }));
      if (search) cities = cities.filter(c => c.name.includes(search));
      if (filter === 'visited') cities = cities.filter(c => c.visited);
      if (filter === 'unvisited') cities = cities.filter(c => !c.visited);

      if (!cities.length) {
        grid.innerHTML = '<div class="empty-tip">无匹配城市</div>';
        return;
      }

      grid.innerHTML = cities.map(c => {
        const a = getArchive(currentProvince, c.name);
        const star = a.rating ? `<span class="rating-mini">${'★'.repeat(a.rating)}</span>` : '';
        return `<div class="city-chip ${c.visited ? 'visited' : 'not-visited'}" data-index="${c.index}">${c.name}${star}</div>`;
      }).join('');

      grid.querySelectorAll('.city-chip').forEach(el => {
        el.addEventListener('click', () => openArchive(currentProvince, parseInt(el.dataset.index)));
      });

      calcStats();
      renderMap();
    }

    // ── 档案弹窗 ──
    function openArchive(province, cityIndex) {
      editingCity = { province, index: cityIndex };
      const city = travelData[province].cities[cityIndex];
      const archive = getArchive(province, city.name);

      document.getElementById('modal-city-name').textContent = city.name;
      document.getElementById('modal-province-name').textContent = travelData[province].name;
      document.getElementById('field-visited').checked = city.visited;
      document.getElementById('visit-label').textContent = city.visited ? '已到访' : '标记为已到访';
      document.getElementById('field-firstVisit').value = archive.firstVisit || '';
      document.getElementById('field-notes').value = archive.notes || '';
      document.getElementById('field-expense').value = archive.expense || '';
      currentRating = archive.rating || 0;
      renderStars();
      renderPhotos(archive.photos || []);

      isEditMode = !city.visited;
      setEditMode(isEditMode);
      document.getElementById('archive-modal').classList.add('open');
    }

    function closeArchive() {
      document.getElementById('archive-modal').classList.remove('open');
      editingCity = null;
    }

    function setEditMode(edit) {
      isEditMode = edit;
      const inner = document.getElementById('archive-modal-inner');
      inner.classList.toggle('view-mode', !edit);
      document.getElementById('btn-edit-toggle').innerHTML = edit
        ? '<i class="fas fa-eye"></i> 预览'
        : '<i class="fas fa-edit"></i> 编辑';
      document.getElementById('btn-save').style.display = edit ? '' : 'none';
    }

    function renderStars() {
      const container = document.getElementById('star-rating');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('i');
        star.className = 'fas fa-star' + (i <= currentRating ? ' active' : '');
        star.dataset.value = i;
        star.addEventListener('click', () => { if (isEditMode) { currentRating = i; renderStars(); } });
        star.addEventListener('mouseenter', () => { if (isEditMode) highlightStars(i); });
        star.addEventListener('mouseleave', () => { if (isEditMode) renderStars(); });
        container.appendChild(star);
      }
    }

    function highlightStars(n) {
      document.querySelectorAll('#star-rating i').forEach((s, i) => {
        s.classList.toggle('hover', i < n);
      });
    }

    function renderPhotos(photos) {
      const gallery = document.getElementById('photo-gallery');
      gallery.innerHTML = photos.map((url, i) => `
        <div class="photo-item">
          <img src="${url}" alt="照片${i+1}" loading="lazy">
          <button class="remove-photo" data-i="${i}"><i class="fas fa-times"></i></button>
        </div>
      `).join('');
      if (isEditMode) {
        gallery.innerHTML += `<div class="photo-add" id="photo-add-btn"><i class="fas fa-camera fa-lg"></i><span>上传</span></div>`;
        document.getElementById('photo-add-btn')?.addEventListener('click', () =>
          document.getElementById('photo-file-input').click());
      }
      gallery.querySelectorAll('.remove-photo').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.i);
          const cur = getCurrentPhotos();
          cur.splice(idx, 1);
          renderPhotos(cur);
        });
      });
    }

    function getCurrentPhotos() {
      return [...document.querySelectorAll('#photo-gallery .photo-item img')].map(img => img.src);
    }

    function saveArchive() {
      if (!editingCity) return;
      const { province, index } = editingCity;
      const city = travelData[province].cities[index];
      const visited = document.getElementById('field-visited').checked;

      city.visited = visited;
      setArchive(province, city.name, {
        firstVisit: document.getElementById('field-firstVisit').value,
        photos: getCurrentPhotos(),
        notes: document.getElementById('field-notes').value.trim(),
        expense: Number(document.getElementById('field-expense').value) || 0,
        rating: currentRating
      });
      saveStorage();
      closeArchive();
      renderCities();
      showToast('档案已保存');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── 导入导出 ──
    function exportData() {
      const blob = new Blob([JSON.stringify({ travelData, archives, exportedAt: new Date().toISOString() }, null, 2)],
        { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `旅行档案_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      showToast('导出成功');
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.travelData) travelData = data.travelData;
          if (data.archives) archives = data.archives;
          saveStorage();
          renderCities();
          showToast('导入成功');
        } catch { showToast('导入失败：文件格式错误'); }
      };
      reader.readAsText(file);
    }

    function loadSample() {
      if (!confirm('加载示例数据将覆盖当前档案，确定继续？')) return;
      travelData = JSON.parse(JSON.stringify(DEFAULT_TRAVEL_DATA));
      archives = JSON.parse(JSON.stringify(SAMPLE_ARCHIVES));
      SAMPLE_VISITED.forEach(([p, c]) => {
        const city = travelData[p]?.cities.find(x => x.name === c);
        if (city) city.visited = true;
      });
      saveStorage();
      currentProvince = '江苏省';
      renderCities();
      showToast('示例数据已加载');
    }

    // ── 事件绑定 ──
    document.getElementById('modal-close').addEventListener('click', closeArchive);
    document.getElementById('archive-modal').addEventListener('click', e => {
      if (e.target.id === 'archive-modal') closeArchive();
    });
    document.getElementById('btn-save').addEventListener('click', saveArchive);
    document.getElementById('btn-edit-toggle').addEventListener('click', () => setEditMode(!isEditMode));
    document.getElementById('field-visited').addEventListener('change', e => {
      document.getElementById('visit-label').textContent = e.target.checked ? '已到访' : '标记为已到访';
    });
    document.getElementById('btn-add-url').addEventListener('click', () => {
      const input = document.getElementById('photo-url-input');
      const url = input.value.trim();
      if (!url) return;
      renderPhotos([...getCurrentPhotos(), url]);
      input.value = '';
    });
    document.getElementById('photo-file-input').addEventListener('change', e => {
      [...e.target.files].forEach(file => {
        if (file.size > 500000) { showToast('图片过大，建议小于 500KB'); return; }
        const reader = new FileReader();
        reader.onload = ev => {
          renderPhotos([...getCurrentPhotos(), ev.target.result]);
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    });
    document.getElementById('city-search').addEventListener('input', renderCities);
    document.getElementById('city-filter').addEventListener('change', renderCities);
    document.getElementById('btn-export').addEventListener('click', exportData);
    document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', e => {
      if (e.target.files[0]) importData(e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('btn-load-sample').addEventListener('click', loadSample);

    // ── 启动 ──
    loadStorage();
    calcStats();
    initMap().then(() => {
      if (!currentProvince) currentProvince = '江苏省';
      renderCities();
    });
  </script>
</body>
</html>
